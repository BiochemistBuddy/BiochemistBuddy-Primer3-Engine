[project]
name = "biochemistbuddy-primer3-engine"
version = "0.1.0"
description = "Isolated GPLv2 Primer3 execution service"
requires-python = ">=3.12"
license = "GPL-2.0-only"
dependencies = [
  "fastapi>=0.115,<1",
  "primer3-py==2.3.0",
  "pyjwt>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
